<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - FarmFinances</title>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      @media (max-width: 576px) {
        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="theme-switch-wrapper">
      <i class="fas fa-sun theme-icon"></i>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
      <i class="fas fa-moon theme-icon"></i>
    </div>

    <div class="container">
      <div class="login-container">
        <div class="login-left">
          <div class="grass-layer-3"></div>
          <div class="grass-layer-2"></div>
          <div class="left-content">
            <h1>FarmFinances</h1>
            <p class="tagline">
              Join our platform for alternative credit evaluation
            </p>
            <div class="features">
              <div class="feature-item">
                <i class="fas fa-map-marked-alt"></i>
                <span>GIS Data Integration</span>
              </div>
              <div class="feature-item">
                <i class="fas fa-cloud-sun-rain"></i>
                <span>Weather Forecast Analysis</span>
              </div>
              <div class="feature-item">
                <i class="fas fa-seedling"></i>
                <span>Soil Health Metrics</span>
              </div>
              <div class="feature-item">
                <i class="fas fa-chart-line"></i>
                <span>Customized Credit Scoring</span>
              </div>
            </div>
          </div>
        </div>
        <div class="login-right">
          <div class="login-form-container">
            <h2>Create Account</h2>
            <p>Register to access FarmFinances services</p>

            <div class="user-type-toggle">
              <button class="active" data-user-type="farmer">Farmer</button>
              <button data-user-type="lender">Financial Institution</button>
            </div>

            <form id="register-form">
              <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-with-icon">
                  <i class="fas fa-user"></i>
                  <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                  />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="email">Email Address</label>
                  <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input
                      type="email"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label for="mobile">Mobile Number</label>
                  <div class="input-with-icon">
                    <i class="fas fa-mobile-alt"></i>
                    <input
                      type="tel"
                      id="mobile"
                      placeholder="Enter your mobile number"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="password">Password</label>
                  <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input
                      type="password"
                      id="password"
                      placeholder="Create password"
                      required
                    />
                    <i class="fas fa-eye toggle-password"></i>
                  </div>
                </div>

                <div class="form-group">
                  <label for="confirm-password">Confirm Password</label>
                  <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input
                      type="password"
                      id="confirm-password"
                      placeholder="Confirm password"
                      required
                    />
                  </div>
                </div>
              </div>

              <div class="form-group">
                <div class="remember-me">
                  <input type="checkbox" id="terms" required />
                  <label for="terms"
                    >I agree to the
                    <a href="#" class="terms-link">Terms & Conditions</a></label
                  >
                </div>
              </div>

              <button type="submit" class="login-btn">Create Account</button>

              <div class="divider">
                <span>or register with</span>
              </div>

              <div class="social-login">
                <button type="button" class="social-btn google">
                  <i class="fab fa-google"></i>
                </button>
                <button type="button" class="social-btn facebook">
                  <i class="fab fa-facebook-f"></i>
                </button>
                <button type="button" class="social-btn mobile">
                  <i class="fas fa-mobile-alt"></i>
                </button>
              </div>
            </form>

            <div class="register-prompt">
              <span>Already have an account?</span>
              <a href="login.html">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById("theme-toggle");

      // Check for saved theme preference or use default
      const currentTheme = localStorage.getItem("theme") || "light";

      // If preference is dark, check the toggle and apply the theme
      if (currentTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        themeToggle.checked = true;
      }

      // Listen for toggle changes
      themeToggle.addEventListener("change", function () {
        if (this.checked) {
          document.documentElement.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        // User type toggle functionality
        const userTypeButtons = document.querySelectorAll(
          ".user-type-toggle button"
        );
        userTypeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            // Remove active class from all buttons
            userTypeButtons.forEach((btn) => btn.classList.remove("active"));
            // Add active class to clicked button
            button.classList.add("active");

            // You can customize the form or UI based on user type if needed
            const userType = button.getAttribute("data-user-type");
            console.log(`User type selected: ${userType}`);

            // Example: Change the button text based on user type
            const registerBtn = document.querySelector(".login-btn");
            registerBtn.textContent =
              userType === "farmer"
                ? "Register as Farmer"
                : "Register as Institution";
          });
        });

        // Password visibility toggle
        const togglePassword = document.querySelector(".toggle-password");
        const passwordInput = document.querySelector("#password");

        if (togglePassword && passwordInput) {
          togglePassword.addEventListener("click", () => {
            // Toggle password visibility
            const type =
              passwordInput.getAttribute("type") === "password"
                ? "text"
                : "password";
            passwordInput.setAttribute("type", type);

            // Toggle eye icon
            togglePassword.classList.toggle("fa-eye");
            togglePassword.classList.toggle("fa-eye-slash");
          });
        }

        // Form validation and submission
        const registerForm = document.getElementById("register-form");

        if (registerForm) {
          registerForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const mobile = document.getElementById("mobile").value;
            const password = document.getElementById("password").value;
            const confirmPassword =
              document.getElementById("confirm-password").value;
            const userType = document
              .querySelector(".user-type-toggle button.active")
              .getAttribute("data-user-type");
            const termsAgreed = document.getElementById("terms").checked;

            // Basic validation
            if (!validateEmail(email)) {
              showError("Please enter a valid email address");
              return;
            }

            if (password.length < 6) {
              showError("Password must be at least 6 characters long");
              return;
            }

            if (password !== confirmPassword) {
              showError("Passwords do not match");
              return;
            }

            if (!termsAgreed) {
              showError("You must agree to the Terms & Conditions");
              return;
            }

            // Register user
            registerUser(name, email, mobile, password, userType);
          });
        }

        // Email validation helper
        function validateEmail(email) {
          const re =
            /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
          return re.test(String(email).toLowerCase());
        }

        // Error message display
        function showError(message) {
          // Check if error message element already exists
          let errorElement = document.querySelector(".error-message");

          if (!errorElement) {
            // Create error element if it doesn't exist
            errorElement = document.createElement("div");
            errorElement.className = "error-message";
            errorElement.style.color = "#ff3333";
            errorElement.style.marginBottom = "15px";
            errorElement.style.fontSize = "14px";

            // Insert before the form
            const form = document.getElementById("register-form");
            form.parentNode.insertBefore(errorElement, form);
          }

          // Update error message
          errorElement.textContent = message;

          // Remove after 3 seconds
          setTimeout(() => {
            errorElement.textContent = "";
          }, 3000);
        }

        // Register user function
        function registerUser(name, email, mobile, password, userType) {
          // Show loading state on button
          const registerBtn = document.querySelector(".login-btn");
          const originalText = registerBtn.textContent;
          registerBtn.textContent = "Creating Account...";
          registerBtn.disabled = true;

          // Prepare data for backend
          const userData = {
            name,
            email,
            mobile,
            password,
            role: userType,
          };

          // Simulate API request delay
          setTimeout(() => {
            console.log("Registration data:", userData);

            // In a real application, you would make an API call to your backend
            // Example fetch call (commented out as backend isn't implemented yet)
            /*
                    fetch('api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(userData),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Store token and redirect
                            localStorage.setItem('token', data.token);
                            window.location.href = userType === 'farmer' ? 'farmer-dashboard.html' : 'lender-dashboard.html';
                        } else {
                            showError(data.message || 'Registration failed');
                        }
                    })
                    .catch(error => {
                        showError('An error occurred. Please try again.');
                        console.error('Error:', error);
                    })
                    .finally(() => {
                        registerBtn.textContent = originalText;
                        registerBtn.disabled = false;
                    });
                    */

            // For demo, simulate success and redirect
            window.location.href =
              userType === "farmer"
                ? "farmer-dashboard.html"
                : "lender-dashboard.html";

            // Reset button state (in case redirect doesn't happen for demo)
            registerBtn.textContent = originalText;
            registerBtn.disabled = false;
          }, 1500);
        }

        // Social registration buttons
        const socialButtons = document.querySelectorAll(".social-btn");

        socialButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const provider = button.classList.contains("google")
              ? "Google"
              : button.classList.contains("facebook")
              ? "Facebook"
              : "Mobile";

            console.log(`Attempting to register with ${provider}`);

            // Handle social registration based on provider
            switch (provider) {
              case "Google":
                window.location.href = "backend/auth/google";
                break;
              case "Facebook":
                window.location.href = "backend/auth/facebook";
                break;
              case "Mobile":
                // Show mobile registration modal
                alert("Mobile registration not implemented in demo");
                break;
            }
          });
        });
      });
    </script>
  </body>
</html>
